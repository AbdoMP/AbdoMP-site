<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2343"/><stop offset="1" stop-color="#040c18"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.4" fill="#00B4D8" fill-opacity=".18"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- chip -->
  <g transform="translate(330 450)">
    <rect x="-170" y="-170" width="340" height="340" rx="22" fill="#0f2f55" stroke="#00B4D8" stroke-width="4"/>
    <rect x="-110" y="-110" width="220" height="220" rx="10" fill="#081a30" stroke="#00CC66" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="54" fill="#ECF0F1">FPGA</text>
    <text x="0" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" fill="#00CC66">200 MS/s</text>
    <g stroke="#00B4D8" stroke-width="6" stroke-linecap="round">
      <path d="M-120 -170v-30M-80 -170v-30M-40 -170v-30M0 -170v-30M40 -170v-30M80 -170v-30M120 -170v-30"/>
      <path d="M-120 170v30M-80 170v30M-40 170v30M0 170v30M40 170v30M80 170v30M120 170v30"/>
      <path d="M-170 -120h-30M-170 -80h-30M-170 -40h-30M-170 0h-30M-170 40h-30M-170 80h-30M-170 120h-30"/>
    </g>
    <g stroke="#00CC66" stroke-width="4" fill="none" opacity=".9">
      <path d="M170 -120 H330 V-255 H560"/><path d="M170 -40 H360 V-130 H560"/>
      <path d="M170 40 H360 V0 H560"/><path d="M170 120 H330 V130 H560"/>
    </g>
  </g>
  <!-- timing diagram -->
  <g fill="none" stroke-width="5" transform="translate(900 0)">
    <g font-family="JetBrains Mono, monospace" font-size="26" fill="#ECF0F1" fill-opacity=".7" stroke="none">
      <text x="-10" y="200" text-anchor="end">CLK</text><text x="-10" y="325" text-anchor="end">D0</text>
      <text x="-10" y="455" text-anchor="end">D1</text><text x="-10" y="585" text-anchor="end">TRIG</text>
    </g>
    <path stroke="#00B4D8" d="M20 215 h30 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h30"/>
    <path stroke="#00CC66" d="M20 340 h110 v-40 h160 v40 h80 v-40 h240 v40 h70"/>
    <path stroke="#00CC66" d="M20 430 h70 v40 h120 v-40 h200 v40 h120 v-40 h150"/>
    <path stroke="#ECF0F1" stroke-opacity=".85" d="M20 600 h290 v-40 h40 v40 h330"/>
    <path stroke="#00CC66" stroke-opacity=".5" stroke-dasharray="10 10" stroke-width="3" d="M310 140 V680"/>
    <rect x="20" y="700" width="660" height="70" rx="12" stroke="#00B4D8" stroke-opacity=".4" stroke-width="2" fill="#00B4D8" fill-opacity=".06"/>
    <text x="45" y="745" font-family="JetBrains Mono, monospace" font-size="26" fill="#00B4D8" stroke="none">0x3A  0x7F  0xC2  0x11  UART@115200</text>
  </g>
</svg>
