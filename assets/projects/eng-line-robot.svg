<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2343"/><stop offset="1" stop-color="#05101f"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00B4D8" stroke-opacity=".08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#00CC66" stop-opacity=".25"/><stop offset="1" stop-color="#00CC66" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="520" rx="620" ry="380" fill="url(#glow)"/>
  <!-- track -->
  <path d="M-50 760 C 300 760 420 560 760 600 S 1250 820 1650 640" fill="none" stroke="#ECF0F1" stroke-opacity=".12" stroke-width="120"/>
  <path d="M-50 760 C 300 760 420 560 760 600 S 1250 820 1650 640" fill="none" stroke="#ECF0F1" stroke-opacity=".9" stroke-width="14" stroke-dasharray="0"/>
  <!-- robot body -->
  <g transform="translate(800 470)">
    <rect x="-230" y="-120" width="460" height="230" rx="40" fill="#0f2f55" stroke="#00B4D8" stroke-width="4"/>
    <rect x="-180" y="-80" width="250" height="150" rx="12" fill="#063d2a" stroke="#00CC66" stroke-width="3"/>
    <rect x="-150" y="-50" width="80" height="80" rx="6" fill="#0B2343" stroke="#00CC66" stroke-opacity=".6"/>
    <g stroke="#00CC66" stroke-width="3" opacity=".8">
      <path d="M-70 -30H20M-70 -10H40M-70 10H10"/>
      <path d="M-110 30V60M-130 30V60M-90 30V60"/>
    </g>
    <circle cx="140" cy="-40" r="16" fill="#00CC66"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="10" r="10" fill="#00B4D8"/>
    <!-- wheels -->
    <rect x="-270" y="-150" width="80" height="60" rx="14" fill="#1a1f2b" stroke="#00B4D8" stroke-opacity=".5" stroke-width="3"/>
    <rect x="190" y="-150" width="80" height="60" rx="14" fill="#1a1f2b" stroke="#00B4D8" stroke-opacity=".5" stroke-width="3"/>
    <rect x="-270" y="80" width="80" height="60" rx="14" fill="#1a1f2b" stroke="#00B4D8" stroke-opacity=".5" stroke-width="3"/>
    <rect x="190" y="80" width="80" height="60" rx="14" fill="#1a1f2b" stroke="#00B4D8" stroke-opacity=".5" stroke-width="3"/>
    <!-- sensor array -->
    <rect x="-150" y="110" width="300" height="34" rx="8" fill="#0B2343" stroke="#00B4D8" stroke-width="3"/>
    <g fill="#00CC66"><circle cx="-110" cy="127" r="7"/><circle cx="-55" cy="127" r="7"/><circle cx="0" cy="127" r="7"/><circle cx="55" cy="127" r="7" fill-opacity=".3"/><circle cx="110" cy="127" r="7" fill-opacity=".3"/></g>
    <path d="M-110 150 L -140 230 M 0 150 L 0 230 M 110 150 L 140 230" stroke="#00CC66" stroke-opacity=".35" stroke-width="3" stroke-dasharray="6 8"/>
  </g>
  <!-- PID readout -->
  <g font-family="JetBrains Mono, monospace" fill="#00B4D8" font-size="30" opacity=".85">
    <text x="80" y="110">Kp=1.20  Ki=0.04  Kd=6.5</text>
    <text x="80" y="155" fill="#00CC66">error → 0.002</text>
  </g>
  <path d="M1080 150 C 1140 60 1180 240 1240 130 S 1340 150 1400 140 S 1480 142 1520 141" fill="none" stroke="#00CC66" stroke-width="5"/>
  <path d="M1080 141 H1520" stroke="#ECF0F1" stroke-opacity=".25" stroke-dasharray="8 8" stroke-width="2"/>
</svg>
