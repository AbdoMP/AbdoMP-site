  <!-- Google Fonts: Space Grotesk, Syne, Inter, JetBrains Mono -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/project.css">

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('am-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.dataset.theme = 'light';
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    })();
  </script>
</head>
